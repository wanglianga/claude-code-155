server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # 应用使用 hash 路由，静态资源直接服务即可；
  # 兜底到 index.html 以兼容直接访问带路径的 URL
  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
  }
}
